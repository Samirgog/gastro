nd:var(--d);color:#fff;font-weight:800}.secondary{background:#e9ece4;color:var(--i)}.empty,.success{text-align:center;padding:76px 10px 20px;color:var(--m)}.empty b{display:block;margin-bottom:8px;color:var(--i);font:600 19px Unbounded,sans-serif}.check{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 20px;border-radius:50%;background:var(--l);color:var(--i);font-size:35px}.success p{font-size:14px;line-height:1.55}.code{margin:25px 0;padding:14px;border-radius:14px;background:#fff;color:var(--i);font-weight:800;font-size:13px}@media(min-width:431px){body{padding:20px 0}.app{min-height:calc(100vh - 40px);border-radius:28px;box-shadow:0 18px 55px #25332324}.bottom{bottom:20px}}

const R=[['pibim','Пибим','Азиатская кухня','11:00–22:00','этаж 1','assets/pibim.jpg',[['Пибим с курицей','Рис, курица во фритюре, корейские салаты и соус',590,'assets/dishes/bibimbap.jpg','Хиты'],['Пибим с говядиной','Рис, жареная говядина, овощи и кимчи',650,'assets/dishes/bibimbap.jpg','Основные блюда'],['Гёдза','Японские пельмени с мясной начинкой',290,'assets/dishes/gyoza.jpg','Закуски'],['Кимчи и огурцы','Острые корейские салаты',190,'assets/dishes/bibimbap.jpg','Закуски'],['Матча-лимонад','Освежающий напиток с цитрусом',260,'assets/dishes/dessert.jpg','Напитки']]],['tom','Tom Yam Wok','Азиатская кухня','10:00–22:00','этаж 1','assets/tom-yam-wok.jpg',[['Том ям','Кокосовый бульон, креветки, грибы и рис',440,'assets/dishes/tom-yum.jpg','Хиты'],['Вок с курицей','Лапша, курица, овощи и фирменный соус',390,'assets/dishes/wok.jpg','Основные блюда'],['Рис с овощами','Ароматный рис, овощи и соус терияки',250,'assets/dishes/wok.jpg','Основные блюда'],['Креветки темпура','Хрустящие креветки с лаймовым соусом',420,'assets/dishes/tom-yum.jpg','Закуски'],['Тайский чай','Сливочный чай со специями',220,'assets/dishes/dessert.jpg','Напитки']]],['meat','Meat Boy Burger','Американская кухня','10:00–22:00','этаж 1','assets/meat-boy-burger.jpeg',[['Классический бургер','Сочная котлета, чеддер, овощи и фирменный соус',490,'assets/dishes/burger.jpg','Хиты'],['Чизбургер','Двойной чеддер, говяжья котлета и соус',540,'assets/dishes/burger.jpg','Основные блюда'],['Картофель фри','Хрустящий картофель с солью',190,'assets/dishes/fries.jpg','Закуски'],['Крылышки BBQ','Куриные крылышки в соусе BBQ',390,'assets/dishes/shawarma.jpg','Закуски'],['Милкшейк ванильный','Густой молочный шейк',280,'assets/dishes/dessert.jpg','Напитки']]],['tortile','В тортилье','Восточная кухня','11:00–22:00','этаж 2','assets/v-tortile.jpg',[['Шаурма BBQ','Мясо, копчёная вишня и соус BBQ в тортилье',420,'assets/dishes/shawarma.jpg','Хиты'],['Шаурма том ям','Пряная шаурма со вкусом том яма',430,'assets/dishes/shawarma.jpg','Основные блюда'],['Шаурма с аджикой','Мясо, кинза, аджика и свежие овощи',410,'assets/dishes/shawarma.jpg','Основные блюда'],['Картофель по-деревенски','Пряный картофель с соусом',210,'assets/dishes/fries.jpg','Закуски'],['Банан в шоколаде','Десерт с шоколадной пастой и арахисом',230,'assets/dishes/dessert.jpg','Десерты']]],['aloha','Aloha','Азиатская кухня','11:00–22:00','этаж 1','assets/corners/aloha.jpg',[['Поке с лососем','Рис, лосось, авокадо, эдамаме и соус понзу',690,'assets/dishes/bibimbap.jpg','Хиты'],['Поке с креветкой','Креветки, манго, рис и кунжутный соус',620,'assets/dishes/tom-yum.jpg','Основные блюда'],['Эдамаме','Бобы с морской солью',220,'assets/dishes/bibimbap.jpg','Закуски'],['Лимонад маракуйя','Домашний лимонад с маракуйей',250,'assets/dishes/dessert.jpg','Напитки']]],['atami','Atami Sushi','Азиатская кухня','10:00–22:00','этаж 1','assets/corners/atami.jpg',[['Сет Филадельфия','Лосось, сливочный сыр и огурец',790,'assets/dishes/bibimbap.jpg','Хиты'],['Ролл Калифорния','Краб, авокадо и тобико',590,'assets/dishes/bibimbap.jpg','Роллы'],['Ролл с угрём','Угорь, соус унаги и кунжут',650,'assets/dishes/wok.jpg','Роллы'],['Мисо-суп','Лёгкий суп с водорослями и тофу',190,'assets/dishes/tom-yum.jpg','Супы']]],['burger-records','Burger Records','Американская кухня','10:00–22:00','этаж 1','assets/corners/burger-records.jpg',[['Smash burger','Хрустящие края, двойной сыр и соус',520,'assets/dishes/burger.jpg','Хиты'],['Chicken burger','Хрустящая курица, салат и соус',470,'assets/dishes/burger.jpg','Основные блюда'],['Луковые кольца','Хрустящие кольца с соусом ранч',240,'assets/dishes/fries.jpg','Закуски'],['Кола','Охлаждённая кола со льдом',150,'assets/dishes/dessert.jpg','Напитки']]],['chingu','Chingu','Азиатская кухня','11:00–23:00','этаж 2','assets/corners/chingu.jpg',[['Корейский жареный цыплёнок','Курица в кляре, соус яннём и кунжут',590,'assets/dishes/shawarma.jpg','Хиты'],['Токпокки','Рисовые клёцки в остром соусе',390,'assets/dishes/tom-yum.jpg','Основные блюда'],['Кимпаб','Ролл из риса, овощей и нори',320,'assets/dishes/bibimbap.jpg','Закуски'],['Юджа-чай','Цитрусовый чай по-корейски',220,'assets/dishes/dessert.jpg','Напитки']]],['pho','Pho Hanoi','Азиатская кухня','10:00–22:00','этаж 1','assets/corners/pho-hanoi.jpg',[['Фо бо','Рисовая лапша, говядина, зелень и бульон',490,'assets/dishes/tom-yum.jpg','Хиты'],['Фо га','Рисовая лапша с курицей и травами',450,'assets/dishes/wok.jpg','Супы'],['Нэм','Хрустящие вьетнамские спринг-роллы',320,'assets/dishes/gyoza.jpg','Закуски'],['Вьетнамский кофе','Кофе со сгущённым молоком',240,'assets/dishes/dessert.jpg','Напитки']]],['akademiya','Академия Десертов','Десерты','10:00–22:00','этаж 2','assets/corners/akademiya.jpg',[['Моти ассорти','Нежные рисовые пирожные с разными начинками',390,'assets/dishes/dessert.jpg','Хиты'],['Чизкейк','Классический сливочный чизкейк',360,'assets/dishes/dessert.jpg','Десерты'],['Вафля с ягодами','Тёплая вафля, крем и сезонные ягоды',420,'assets/dishes/dessert.jpg','Десерты'],['Капучино','Эспрессо с плотной молочной пеной',220,'assets/dishes/tom-yum.jpg','Напитки']]],['rybernaya','Рёберная','Американская кухня','10:00–22:00','этаж 1','assets/corners/rybernaya.jpg',[['Рёбра BBQ','Томлёные свиные рёбра в соусе BBQ',790,'assets/dishes/shawarma.jpg','Хиты'],['Стейк-хаус бургер','Говядина, бекон, сыр и лук',620,'assets/dishes/burger.jpg','Основные блюда'],['Коулслоу','Хрустящий салат с фирменной заправкой',220,'assets/dishes/bibimbap.jpg','Закуски'],['Домашний морс','Ягодный морс',180,'assets/dishes/dessert.jpg','Напитки']]]];
let filter='Все',current=null,cart=[];const app=document.querySelector('#app'),bottom=document.querySelector('#bottom'),rub=n=>n.toLocaleString('ru-RU')+' ₽',n=()=>cart.reduce((s,x)=>s+x.q,0),sum=()=>cart.reduce((s,x)=>s+x.q*x.p,0);function header(back){return '<header class="top">'+(back?'<button class="back" id="back">←</button>':'<div class="brand">гастро<span>.</span></div>')+'<div class="table"><i class="dot"></i>Стол №12</div></header>'}const countEl=document.querySelector('#count'),sumEl=document.querySelector('#sum');function sync(){countEl.textContent=n();sumEl.textContent=rub(sum())}
function home(){current=null;let v=filter==='Все'?R:R.filter(x=>x[2]===filter);app.innerHTML=header()+ '<h1>Закажите то,<br>что хочется</h1><p class="lead">Все корнеры гастрокорта — в одном заказе.<br>Принесём прямо к вашему столику.</p><section class="promo"><small>Гастро-предложение недели</small><b>Откройте паназиатский стритфуд</b></section><div class="section"><h2>Выберите кухню</h2></div><nav class="chips">'+['Все','Азиатская кухня','Американская кухня','Восточная кухня','Десерты'].map(x=>'<button class="chip '+(filter===x?'active':'')+'" data-f="'+x+'">'+(x==='Все'?'Все корнеры':x.replace(' кухня',''))+'</button>').join('')+'</nav><div class="section"><h2>'+v.length+' корнеров рядом</h2></div><section class="grid">'+v.map(x=>'<button class="card" data-r="'+x[0]+'"><img src="'+x[5]+'" alt="'+x[1]+'"><span class="floor">'+x[4]+'</span><h3>'+x[1]+'</h3><p>'+x[2]+' · '+x[3]+'</p></button>').join('')+'</section>';app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;home()});app.querySelectorAll('[data-r]').forEach(b=>{b.onclick=()=>{current=R.find(x=>x[0]===b.dataset.r);restaurant()}})}
function restaurant(){let r=current,cats=[...new Set(r[6].map(d=>d[4]))];app.innerHTML=header(true)+'<div class="hero"><img src="'+r[5]+'" alt="'+r[1]+'"></div><h1>'+r[1]+'</h1><div class="info"><span class="tag">'+r[2]+'</span><span class="tag">'+r[4]+'</span><span class="tag">'+r[3]+'</span></div><div class="note">Меню и цены представлены для демонстрации интерфейса.</div><h2 class="menu">Меню</h2>'+cats.map(cat=>'<h3 class="menu-cat">'+cat+'</h3>'+r[6].map((d,i)=>d[4]===cat?'<article class="dish"><img src="'+d[3]+'" alt="'+d[0]+'"><div class="details"><h3>'+d[0]+'</h3><p>'+d[1]+'</p><div class="dishfoot"><span>'+rub(d[2])+'</span><button class="add" data-a="'+i+'">+</button></div></div></article>':'').join('')).join('');document.querySelector('#back').onclick=home;app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>add(r,+b.dataset.a,b))}
function add(r,i,b){let d=r[6][i],x=cart.find(x=>x.r===r[1]&&x.name===d[0]);x?x.q++:cart.push({r:r[1],name:d[0],p:d[2],img:d[3],q:1});bottom.classList.remove('hidden');sync();b.textContent='✓';setTimeout(()=>b.textContent='+',550)}
function basket(){app.innerHTML=header(true)+'<h1>Корзина</h1>'+(cart.length?'<p class="lead">Заказ будет доставлен к столику №12.</p>'+cart.map((x,i)=>'<article class="order"><img src="'+x.img+'" alt=""><div class="details"><b>'+x.name+'</b><small>'+x.r+' · '+rub(x.p)+'</small></div><div class="step"><button data-m="'+i+'">−</button><b>'+x.q+'</b><button data-p="'+i+'">+</button></div></article>').join('')+'<div class="total"><span>Итого</span><span>'+rub(sum())+'</span></div><button class="checkout" id="checkout">Оформить заказ · '+rub(sum())+'</button>':'<div class="empty"><b>Корзина пуста</b>Добавьте блюда из любого корнера — мы объединим их в один заказ.</div><button class="secondary" id="go">Выбрать блюда</button>');document.querySelector('#back').onclick=()=>current?restaurant():home();let go=document.querySelector('#go');if(go)go.onclick=home;app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{cart[b.dataset.p].q++;basket();sync()});app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{let i=b.dataset.m;if(--cart[i].q===0)cart.splice(i,1);basket();sync()});let check=document.querySelector('#checkout');if(check)check.onclick=success}
function success(){bottom.classList.add('hidden');app.innerHTML=header()+'<section class="success"><div class="check">✓</div><h1>Заказ принят!</h1><p>Корнеры начали готовить блюда. Мы принесём заказ к столику №12 примерно через 15 минут.</p><div class="code">Заказ № G-'+(1000+Math.floor(Math.random()*9000))+'</div><button class="secondary" id="again">Собрать новый заказ</button></section>';document.querySelector('#again').onclick=()=>{cart=[];filter='Все';home();sync()}}document.querySelector('#open-cart').onclick=basket;home();sync();
</script><style>.menu-cat{margin:24px 0 4px;color:var(--o);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}</style></body></html>
